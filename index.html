<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8">
  <title>Lista de Tareas</title>
</head>
<body>
    <button id="dark_mode" onclick="toggleTheme()">Tema</button>

    <style>
    body {
        background: white;
        color: black;
        display: flex;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    .dark {
        background: #121212;
        color: white;
    }
</style>
    <h1>Mis tareas</h1>

    <input type="text" id="input" placeholder="Escribe una tarea">
    <button onclick="addTask()">Agregar</button>
    <br><br>
      <!-- NUEVO: botones de filtro -->
  <button onclick="setFilter('todas')">Todas</button>
  <button onclick="setFilter('pendientes')">Pendientes</button>
  <button onclick="setFilter('completadas')">Completadas</button>

    <div id="list"></div>

    <!-- IMPORTANTE: conecta el JS -->
    <script src="./1.js"></script>

</body>

</html>
